name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Substitua por master se a sua branch principal tiver esse nome

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-js-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar Projeto (Build)
        run: npm run build

      - name: Fazer o Deploy no GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Pasta padrão que o Vite/Lovable gera após o build
          branch: gh-pages # O robô vai criar uma ramificação limpa só com o site pronto
